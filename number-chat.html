<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#06152B">

<title>Kulzzy Number Chat</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#020d1a;
    color:white;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
}

.kulzzyBox{

    width:100%;
    max-width:500px;

    background:#07152f;

    border:2px solid #ffd700;

    border-radius:20px;

    padding:30px 20px;

    text-align:center;

    box-shadow:
        0 10px 40px rgba(0,0,0,.5);

}

.logo{

    width:90px;
    height:90px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #ffd700;

    margin-bottom:15px;

}

h1{

    margin:0;

    color:#ffd700;

    font-size:28px;

}

p{

    line-height:1.6;

    color:#ddd;

}

.chatButton{

    display:block;

    width:100%;

    margin-top:25px;

    padding:17px;

    background:#ffd700;

    color:#07152f;

    text-decoration:none;

    border-radius:12px;

    font-size:18px;

    font-weight:900;

    border:0;

}

.chatButton:active{

    transform:scale(.98);

}

.backButton{

    display:block;

    margin-top:15px;

    padding:14px;

    color:white;

    text-decoration:none;

    border:1px solid rgba(255,215,0,.5);

    border-radius:12px;

    font-weight:bold;

}

.note{

    margin-top:20px;

    font-size:12px;

    color:#aaa;

}

</style>

</head>

<body>

<div class="kulzzyBox">

    <img
        src="./logo.jpg"
        class="logo"
        alt="Kulzzy Radio Network">

    <h1>
        💬 KULZZY NUMBER CHAT
    </h1>

    <p>
        Send and receive private messages
        through Kulzzy Radio Network.
    </p>

    <p>
        Chat directly with your registered
        Kulzzy number.
    </p>

    <a
        class="chatButton"
        href="https://kulzzy-message-panel-sljvl3.v2.appdeploy.ai/#chat">

        💬 JOIN NUMBER CHAT

    </a>

    <a
        class="backButton"
        href="./index.html">

        ← BACK TO KULZZY RADIO

    </a>

    <div class="note">

        Kulzzy Radio Network — Celebrating Lives Everyday

    </div>

</div>

</body>
</html>
