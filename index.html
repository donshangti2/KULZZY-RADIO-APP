/* =====================================================

===================================================== */

}

html,

/* =====================================================

===================================================== */

#kulzzyNav{

    left:50%;

===================================================== */

    background:transparent;

    color:white;

<script type="module">

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getDatabase,
    ref,
    get

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",

    authDomain:
        "kulzzy-radio-chat.firebaseapp.com",

    databaseURL:
        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kulzzy-radio-chat",

    storageBucket:
        "kulzzy-radio-chat.firebasestorage.app",

    messagingSenderId:
        "510100635134",

    appId:
        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


let db = null;


try{

    const app =
        initializeApp(
            firebaseConfig
        );

    db =
        getDatabase(
            app
        );

}

catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

}


/* =====================================================
   SECTIONS
===================================================== */

const normalSections = [

    "home",
    "request",
    "wishes",
    "market"

];


/* =====================================================
   CACHE
===================================================== */

const sectionCache =
    Object.create(null);

const sectionLoading =
    Object.create(null);


/* =====================================================
   MORE CACHE
===================================================== */

let morePagesLoaded =
    false;

let morePagesLoading =
    null;

let morePagesData =
    [];


/* =====================================================
   GET PAGE HTML
===================================================== */

function getPageHTML(page){

    if(!page){

        return "";

    }


    if(

        typeof page.html === "string" &&

        page.html.trim()

    ){

        return page.html;

    }


    const possibleFields = [

        "content",
        "writeUp",
        "writeup",
        "body",
        "description",
        "pageContent",
        "htmlContent"

    ];


    for(
        const field of possibleFields
    ){

        if(

            typeof page[field] === "string" &&

            page[field].trim()

        ){

            return page[field];

        }

    }


    if(

        page.blocks &&

        typeof page.blocks === "object"

    ){

        const blocks =

            Object.keys(
                page.blocks
            )

            .map(function(id){

                const block =
                    page.blocks[id] || {};


                return {

                    id:id,

                    html:

                        block.html ||

                        block.content ||

                        block.writeUp ||

                        "",

                    order:

                        typeof block.order ===
                        "number"

                        ? block.order
                        : 0

                };

            })

            .filter(function(block){

                return (

                    typeof block.html ===
                    "string" &&

                    block.html.trim()

                );

            })

            .sort(function(a,b){

                return a.order - b.order;

            });


        if(blocks.length){

            return blocks

                .map(function(block){

                    return block.html;

                })

                .join("\n\n");

        }

    }


    return "";

}


/* =====================================================
   EXECUTE PUBLISHED SCRIPTS
===================================================== */

function executePublishedScripts(
    container
){

    if(!container){

        return;

    }


    const scripts =
        container.querySelectorAll(
            "script"
        );


    scripts.forEach(function(
        oldScript
    ){

        const newScript =
            document.createElement(
                "script"
            );


        Array.from(
            oldScript.attributes
        )

        .forEach(function(attribute){

            newScript.setAttribute(

                attribute.name,

                attribute.value

            );

        });


        newScript.textContent =
            oldScript.textContent;


        if(oldScript.parentNode){

            oldScript.parentNode
                .replaceChild(
                    newScript,
                    oldScript
                );

        }

    });

}


/* =====================================================
   DISPLAY NORMAL CONTENT
===================================================== */

function displayNormalContent(
    section,
    html
){

    const container =

        document.getElementById(

            "kulzzyPublished-" +
            section

        );


    if(!container){

        return;

    }


    if(
        !html ||
        !html.trim()
    ){

        container.innerHTML = "";

        sectionCache[section] = "";

        return;

    }


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.innerHTML =
        html;


    container.innerHTML = "";


    container.appendChild(
        wrapper
    );


    executePublishedScripts(
        wrapper
    );


    sectionCache[section] =
        container.innerHTML;

}


/* =====================================================
   FAST FIREBASE SECTION LOAD
===================================================== */

async function loadNormalSection(
    section
){

    if(
        !normalSections.includes(
            section
        )
    ){

        return;

    }


    const container =

        document.getElementById(

            "kulzzyPublished-" +
            section

        );


    if(!container){

        return;

    }


    /*
       CACHE HIT
    */

    if(
        Object.prototype.hasOwnProperty.call(
            sectionCache,
            section
        )
    ){

        if(
            !container.innerHTML &&
            sectionCache[section]
        ){

            container.innerHTML =
                sectionCache[section];

        }

        return;

    }


    /*
       DUPLICATE REQUEST PROTECTION
    */

    if(
        sectionLoading[section]
    ){

        return sectionLoading[section];

    }


    if(!db){

        return;

    }


    /*
       FIREBASE REQUEST
    */

    sectionLoading[section] =

        get(

            ref(

                db,

                "kulzzyContent/" +
                section

            )

        )

        .then(function(snapshot){

            if(
                !snapshot.exists()
            ){

                container.innerHTML = "";

                sectionCache[section] = "";

                return;

            }


            const data =
                snapshot.val();


            const html =
                getPageHTML(
                    data
                );


            displayNormalContent(
                section,
                html
            );

        })

        .catch(function(error){

            console.error(

                "Firebase error:",
                section,
                error

            );

        })

        .finally(function(){

            delete sectionLoading[
                section
            ];

        });


    return sectionLoading[section];

}


/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(
    section,
    button
){

    document
        .querySelectorAll(
            ".kulzzySection"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    const target =
        document.getElementById(
            "kulzzy-" +
            section
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(
            ".kulzzyNavBtn"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(
        normalSections.includes(
            section
        )
    ){

        loadNormalSection(
            section
        );

    }


    if(
        section === "more"
    ){

        loadMorePages();

    }

}


/* =====================================================
   PUBLIC NAVIGATION
===================================================== */

window.kulzzyOpen =

    function(
        section,
        button
    ){

        openSection(
            section,
            button
        );

    };


/* =====================================================
   NAVIGATION EVENTS
===================================================== */

document
    .querySelectorAll(
        ".kulzzyNavBtn"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                openSection(

                    button.dataset.section,

                    button

                );

            }
        );

    });


/* =====================================================
   LOAD MORE PAGES
===================================================== */

async function loadMorePages(){

    const menu =

        document.getElementById(
            "kulzzyMorePagesMenu"
        );


    const content =

        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(
        !menu ||
        !content
    ){

        return;

    }


    if(
        morePagesLoaded
    ){

        return;

    }


    if(
        morePagesLoading
    ){

        return morePagesLoading;

    }


    if(!db){

        return;

    }


    morePagesLoading =

        get(

            ref(

                db,

                "kulzzyMorePages"

            )

        )

        .then(function(snapshot){

            menu.innerHTML = "";

            content.innerHTML = "";


            if(
                !snapshot.exists()
            ){

                morePagesLoaded =
                    true;

                return;

            }


            const data =
                snapshot.val();


            morePagesData =

                Object.keys(
                    data
                )

                .map(function(id){

                    const page =
                        data[id] || {};


                    return {

                        id:id,

                        title:

                            page.title ||

                            page.name ||

                            "Untitled Page",

                        html:

                            getPageHTML(
                                page
                            ),

                        order:

                            typeof page.order ===
                            "number"

                            ? page.order
                            : 0

                    };

                })

                .sort(function(a,b){

                    return a.order -
                           b.order;

                });


            const fragment =
                document.createDocumentFragment();


            morePagesData.forEach(
                function(page){

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";


                    button.className =
                        "kulzzyMorePageButton";


                    button.textContent =
                        page.title;


                    button.addEventListener(
                        "click",
                        function(){

                            showMorePage(
                                page,
                                button
                            );

                        }
                    );


                    fragment.appendChild(
                        button
                    );

                }
            );


            menu.appendChild(
                fragment
            );


            morePagesLoaded =
                true;

        })

        .catch(function(error){

            console.error(
                "Firebase More pages error:",
                error
            );

        })

        .finally(function(){

            morePagesLoading =
                null;

        });


    return morePagesLoading;

}


/* =====================================================
   SHOW MORE PAGE
===================================================== */

function showMorePage(
    page,
    button
){

    const content =

        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!content){

        return;

    }


    document
        .querySelectorAll(
            ".kulzzyMorePageButton"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    content.innerHTML = "";


    const html =
        getPageHTML(
            page
        );


    if(
        !html ||
        !html.trim()
    ){

        return;

    }


    const pageBox =
        document.createElement(
            "div"
        );


    pageBox.className =
        "kulzzyMorePageContentBox";


    pageBox.innerHTML =
        html;


    content.appendChild(
        pageBox
    );


    executePublishedScripts(
        pageBox
    );

}


/* =====================================================
   START HOME
===================================================== */

if(db){

    loadNormalSection(
        "home"
    );

}


/* =====================================================
   QUIET BACKGROUND PRELOAD
===================================================== */

setTimeout(function(){

    if(!db){

        return;

    }


    [
        "request",
        "wishes",
        "market"

    ]

    .forEach(function(section){

        loadNormalSection(
            section
        );

    });

},1200);

</script>


<!-- =====================================================
     KULZZY RADIO PLAYER JAVASCRIPT
===================================================== -->

<script>

const CONFIG_URL = "config.json";


const audio =
    document.getElementById(
        "audioPlayer"
    );


const playButton =
    document.getElementById(
        "bigPlayButton"
    );


const buttonLabel =
    document.getElementById(
        "buttonLabel"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );


const casterLive =
    document.getElementById(
        "casterLive"
    );


let currentAudio = "";

let currentMode = "";

let currentPlayMode =
    "REPEAT";

let userHasStartedAudio =
    false;

let randomizing =
    false;


/* =====================================================
   LOAD CONFIG
===================================================== */

async function loadConfig(){

    try{

        const response =
            await fetch(

                CONFIG_URL +
                "?t=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        if(!response.ok){

            throw new Error(
                "Config could not be loaded"
            );

        }


        const config =
            await response.json();


        if(

            config.nowPlaying &&

            config.nowPlaying.trim() !== ""

        ){

            nowPlaying.textContent =
                config.nowPlaying;

        }

        else{

            nowPlaying.textContent =
                "Kulzzy Radio Network • Celebrating Lives Everyday";

        }


        currentPlayMode =
            String(
                config.playMode ||
                "REPEAT"
            ).toUpperCase();


        if(

            String(
                config.status
            ).toUpperCase()
            ===
            "LIVE"

        ){

            switchToLive();

        }

        else{

            switchToAudio(
                config.currentAudio
            );

        }

    }

    catch(error){

        console.log(
            "Kulzzy player:",
            error
        );

    }

}


/* =====================================================
   LIVE MODE
===================================================== */

function switchToLive(){

    if(
        currentMode === "LIVE"
    ){

        return;

    }


    currentMode =
        "LIVE";


    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();


    casterLive.style.display =
        "block";


    playButton.style.display =
        "none";


    buttonLabel.style.display =
        "none";


    statusText.style.display =
        "block";


    statusText.textContent =
        "🔴 LIVE ON AIR";

}


/* =====================================================
   AUDIO MODE
===================================================== */

function switchToAudio(
    audioFile
){

    if(!audioFile){

        return;

    }


    currentMode =
        "AUDIO";


    casterLive.style.display =
        "none";


    playButton.style.display =
        "flex";


    buttonLabel.style.display =
        "block";


    statusText.style.display =
        "block";


    statusText.textContent =
        "🎵 AUTOMATIC AUDIO";


    if(
        currentAudio !== audioFile
    ){

        const wasPlaying =
            !audio.paused &&
            !audio.ended;


        currentAudio =
            audioFile;


        audio.pause();


        audio.src =
            audioFile +
            "?v=" +
            Date.now();


        audio.load();


        playButton.classList.remove(
            "playing"
        );


        playButton.textContent =
            "▶";


        buttonLabel.textContent =
            "TAP TO PLAY";


        if(wasPlaying){

            userHasStartedAudio =
                true;

        }

    }

}


/* =====================================================
   RANDOM POSITION
===================================================== */

function getRandomStartPosition(){

    const duration =
        audio.duration;


    if(
        !Number.isFinite(duration) ||
        duration <= 0
    ){

        return 0;

    }


    const safeEnd =
        Math.max(
            0,
            duration - 0.5
        );


    if(
        safeEnd <= 0
    ){

        return 0;

    }


    return Math.random() *
           safeEnd;

}


/* =====================================================
   SET RANDOM POSITION
===================================================== */

function setRandomPosition(){

    if(

        !Number.isFinite(
            audio.duration
        ) ||

        audio.duration <= 0

    ){

        return false;

    }


    const randomPosition =
        getRandomStartPosition();


    try{

        audio.currentTime =
            randomPosition;

        return true;

    }

    catch(error){

        console.log(
            "Random position error:",
            error
        );

        return false;

    }

}


/* =====================================================
   RANDOM RESTART
===================================================== */

async function randomRestartAndPlay(){

    if(randomizing){

        return;

    }


    randomizing =
        true;


    try{

        if(

            !Number.isFinite(
                audio.duration
            ) ||

            audio.duration <= 0

        ){

            await new Promise(
                function(resolve){

                    let finished =
                        false;


                    function done(){

                        if(finished){

                            return;

                        }


                        finished =
                            true;


                        clearTimeout(
                            timer
                        );


                        audio.removeEventListener(
                            "loadedmetadata",
                            done
                        );


                        resolve();

                    }


                    const timer =
                        setTimeout(
                            done,
                            5000
                        );


                    audio.addEventListener(

                        "loadedmetadata",

                        done,

                        {
                            once:true
                        }

                    );

                }
            );

        }


        if(

            !Number.isFinite(
                audio.duration
            ) ||

            audio.duration <= 0

        ){

            await audio.play();

        }

        else{

            setRandomPosition();


            await new Promise(
                function(resolve){

                    requestAnimationFrame(
                        resolve
                    );

                }
            );


            await audio.play();

        }


        userHasStartedAudio =
            true;


        playButton.classList.add(
            "playing"
        );


        playButton.textContent =
            "❚❚";


        buttonLabel.textContent =
            "NOW PLAYING";

    }

    catch(error){

        console.log(
            "Random repeat error:",
            error
        );

    }

    finally{

        randomizing =
            false;

    }

}


/* =====================================================
   PLAY BUTTON
===================================================== */

playButton.addEventListener(
    "click",
    async function(){

        if(
            currentMode !== "AUDIO"
        ){

            return;

        }


        try{

            if(audio.paused){

                if(
                    !userHasStartedAudio
                ){

                    await randomRestartAndPlay();

                }

                else{

                    await audio.play();


                    playButton.classList.add(
                        "playing"
                    );


                    playButton.textContent =
                        "❚❚";


                    buttonLabel.textContent =
                        "NOW PLAYING";

                }

            }

            else{

                audio.pause();


                playButton.classList.remove(
                    "playing"
                );


                playButton.textContent =
                    "▶";


                buttonLabel.textContent =
                    "TAP TO PLAY";

            }

        }

        catch(error){

            console.log(
                "Audio play error:",
                error
            );

        }

    }
);


/* =====================================================
   AUDIO ENDED
===================================================== */

audio.addEventListener(
    "ended",
    function(){

        if(
            currentPlayMode ===
            "REPEAT"
        ){

            randomRestartAndPlay();

            return;

        }


        userHasStartedAudio =
            false;


        playButton.classList.remove(
            "playing"
        );


        playButton.textContent =
            "▶";


        buttonLabel.textContent =
            "TAP TO PLAY";

    }
);


/* =====================================================
   AUDIO ERROR
===================================================== */

audio.addEventListener(
    "error",
    function(){

        console.log(
            "Audio element error:",
            audio.error
        );

    }
);


/* =====================================================
   START PLAYER
===================================================== */

loadConfig();


/* =====================================================
   FAST CONFIG REFRESH
===================================================== */

setInterval(
    loadConfig,
    1000
);


/* =====================================================
   INITIAL PLAYER STATE
===================================================== */

buttonLabel.style.display =
    "none";


</script>


</body>
