/* =====================================================

const firebaseConfig = {

        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",

        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =====================================================
   PLAYER ELEMENTS
===================================================== */

const audio =
    document.getElementById("audioPlayer");

const playButton =
    document.getElementById("bigPlayButton");

const buttonLabel =
    document.getElementById("buttonLabel");

const statusText =
    document.getElementById("statusText");

const nowPlaying =
    document.getElementById("nowPlaying");

const casterLive =
    document.getElementById("casterLive");

const listenerCount =
    document.getElementById("listenerCount");


/* =====================================================
   PLAYER VARIABLES
===================================================== */

let currentAudio = "";

let currentMode = "";

let currentPlayMode = "REPEAT";

let userHasStartedAudio = false;

let randomizing = false;


/* =====================================================
   SECTION VARIABLES
===================================================== */

const normalSections = [
    "home",
    "request",
    "wishes",
    "market"
];

const loadedSections =
    Object.create(null);

const loadingSections =
    Object.create(null);

let morePagesLoaded = false;

let morePagesLoading = false;

let morePagesData = [];


/* =====================================================
   PAGE HTML
===================================================== */

function getPageHTML(page){

    if(!page){
        return "";
    }

    if(
        typeof page.html === "string" &&
        page.html.trim()
    ){
        return page.html;
    }

    const fields = [
        "content",
        "writeUp",
        "writeup",
        "body",
        "description",
        "pageContent",
        "htmlContent"
    ];

    for(const field of fields){

        if(
            typeof page[field] === "string" &&
            page[field].trim()
        ){
            return page[field];
        }

    }

    if(
        page.blocks &&
        typeof page.blocks === "object"
    ){

        const blocks =
            Object.keys(page.blocks)
            .map(function(id){

                const block =
                    page.blocks[id] || {};

                return {

                    id:id,

                    html:
                        block.html ||
                        block.content ||
                        block.writeUp ||
                        "",

                    order:
                        typeof block.order === "number"
                        ? block.order
                        : 0

                };

            })
            .filter(function(block){

                return (
                    typeof block.html === "string" &&
                    block.html.trim()
                );

            })
            .sort(function(a,b){

                return a.order - b.order;

            });

        if(blocks.length){

            return blocks
                .map(function(block){
                    return block.html;
                })
                .join("\n\n");

        }

    }

    return "";
}


/* =====================================================
   EXECUTE PAGE SCRIPTS
===================================================== */

function executePublishedScripts(container){

    if(!container){
        return;
    }

    const scripts =
        container.querySelectorAll("script");

    scripts.forEach(function(oldScript){

        const newScript =
            document.createElement("script");

        Array.from(
            oldScript.attributes
        )
        .forEach(function(attribute){

            newScript.setAttribute(
                attribute.name,
                attribute.value
            );

        });

        newScript.textContent =
            oldScript.textContent;

        if(oldScript.parentNode){

            oldScript.parentNode.replaceChild(
                newScript,
                oldScript
            );

        }

    });

}


/* =====================================================
   DISPLAY NORMAL CONTENT
===================================================== */

function displayNormalContent(section,html){

    const container =
        document.getElementById(
            "kulzzyPublished-" + section
        );

    if(!container){
        return;
    }

    if(!html || !html.trim()){

        loadedSections[section] = true;

        return;
    }

    const wrapper =
        document.createElement("div");

    wrapper.innerHTML = html;

    container.innerHTML = "";

    container.appendChild(wrapper);

    executePublishedScripts(wrapper);

    loadedSections[section] = true;
}


/* =====================================================
   LOAD NORMAL SECTION
===================================================== */

async function loadNormalSection(section){

    if(
        !normalSections.includes(section)
    ){
        return;
    }

    if(loadedSections[section]){
        return;
    }

    if(loadingSections[section]){
        return loadingSections[section];
    }

    loadingSections[section] =
        (async function(){

            try{

                const snapshot =
                    await get(
                        ref(
                            db,
                            "kulzzyContent/" + section
                        )
                    );

                if(!snapshot.exists()){

                    loadedSections[section] = true;

                    return;
                }

                const data =
                    snapshot.val();

                const html =
                    getPageHTML(data);

                displayNormalContent(
                    section,
                    html
                );

            }
            catch(error){

                console.log(
                    "Kulzzy section:",
                    section,
                    error
                );

            }

        })();

    try{

        await loadingSections[section];

    }
    finally{

        delete loadingSections[section];

    }

}


/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(section,button){

    document
        .querySelectorAll(".kulzzySection")
        .forEach(function(item){

            item.classList.remove("active");

        });


    const target =
        document.getElementById(
            "kulzzy-" + section
        );


    if(target){

        target.classList.add("active");

    }


    document
        .querySelectorAll(".kulzzyNavBtn")
        .forEach(function(item){

            item.classList.remove("active");

        });


    if(button){

        button.classList.add("active");

    }


    if(normalSections.includes(section)){

        loadNormalSection(section);

    }


    if(section === "more"){

        loadMorePages();

    }

}


/* =====================================================
   NAVIGATION EVENTS
===================================================== */

document
    .querySelectorAll(".kulzzyNavBtn")
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                openSection(
                    button.dataset.section,
                    button
                );

            }
        );

    });


window.kulzzyOpen =
    function(section,button){

        openSection(
            section,
            button
        );

    };


/* =====================================================
   MORE PAGES
===================================================== */

async function loadMorePages(){

    const menu =
        document.getElementById(
            "kulzzyMorePagesMenu"
        );

    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );

    if(!menu || !content){
        return;
    }

    if(morePagesLoaded){
        return;
    }

    if(morePagesLoading){
        return morePagesLoading;
    }

    morePagesLoading =
        (async function(){

            try{

                const snapshot =
                    await get(
                        ref(
                            db,
                            "kulzzyMorePages"
                        )
                    );

                if(!snapshot.exists()){

                    morePagesLoaded = true;

                    return;
                }

                const data =
                    snapshot.val();

                morePagesData =
                    Object.keys(data)
                    .map(function(id){

                        const page =
                            data[id] || {};

                        return {

                            id:id,

                            title:
                                page.title ||
                                page.name ||
                                "Untitled Page",

                            html:
                                getPageHTML(page),

                            order:
                                typeof page.order === "number"
                                ? page.order
                                : 0

                        };

                    })
                    .sort(function(a,b){

                        return a.order - b.order;

                    });


                menu.innerHTML = "";

                const fragment =
                    document.createDocumentFragment();


                morePagesData.forEach(function(page){

                    const button =
                        document.createElement("button");

                    button.type = "button";

                    button.className =
                        "kulzzyMorePageButton";

                    button.textContent =
                        page.title;


                    button.addEventListener(
                        "click",
                        function(){

                            showMorePage(
                                page,
                                button
                            );

                        }
                    );


                    fragment.appendChild(button);

                });


                menu.appendChild(fragment);

                morePagesLoaded = true;

            }
            catch(error){

                console.log(
                    "More pages:",
                    error
                );

            }
            finally{

                morePagesLoading = false;

            }

        })();

    return morePagesLoading;
}


/* =====================================================
   SHOW MORE PAGE
===================================================== */

function showMorePage(page,button){

    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );

    if(!content){
        return;
    }


    document
        .querySelectorAll(
            ".kulzzyMorePageButton"
        )
        .forEach(function(item){

            item.classList.remove("active");

        });


    if(button){

        button.classList.add("active");

    }


    const html =
        getPageHTML(page);


    content.innerHTML = "";


    if(!html || !html.trim()){
        return;
    }


    const box =
        document.createElement("div");

    box.className =
        "kulzzyMorePageContentBox";

    box.innerHTML =
        html;

    content.appendChild(box);

    executePublishedScripts(box);

}


/* =====================================================
   LISTENER COUNT
===================================================== */

function updateListenerDisplay(value){

    let count = 0;

    if(typeof value === "number"){
        count = value;
    }

    else if(
        value &&
        typeof value === "object"
    ){

        if(typeof value.count === "number"){
            count = value.count;
        }

        else if(typeof value.value === "number"){
            count = value.value;
        }

        else{
            count =
                Object.keys(value).length;
        }

    }

    else if(value){

        const number =
            Number(value);

        if(Number.isFinite(number)){
            count = number;
        }

    }


    if(count < 0){
        count = 0;
    }


    listenerCount.textContent =
        count.toLocaleString();
}


/*
   The listener counter checks the common
   listener locations without affecting the
   radio player.
*/

const listenerPaths = [
    "activeListeners",
    "listeners",
    "listenerCount",
    "stats/activeListeners",
    "stats/listeners",
    "stats/listenerCount"
];


function watchListenerPath(index){

    if(index >= listenerPaths.length){
        return;
    }

    const path =
        listenerPaths[index];

    const listenerRef =
        ref(db,path);

    onValue(
        listenerRef,
        function(snapshot){

            if(snapshot.exists()){

                updateListenerDisplay(
                    snapshot.val()
                );

            }

        },
        function(){

            watchListenerPath(index + 1);

        }
    );

}


watchListenerPath(0);


/* =====================================================
   PLAYER CONFIG
===================================================== */

async function loadConfig(){

    try{

        const response =
            await fetch(
                "config.json?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){
            return;
        }


        const config =
            await response.json();


        if(
            config.nowPlaying &&
            config.nowPlaying.trim()
        ){

            nowPlaying.textContent =
                config.nowPlaying;

        }
        else{

            nowPlaying.textContent =
                "Kulzzy Radio Network • Celebrating Lives Everyday";

        }


        currentPlayMode =
            String(
                config.playMode ||
                "REPEAT"
            ).toUpperCase();


        const status =
            String(
                config.status ||
                "AUDIO"
            ).toUpperCase();


        if(status === "LIVE"){

            switchToLive();

        }
        else{

            switchToAudio(
                config.currentAudio
            );

        }

    }
    catch(error){

        console.log(
            "Kulzzy config:",
            error
        );

    }

}


/* =====================================================
   LIVE MODE
===================================================== */

function switchToLive(){

    if(currentMode === "LIVE"){
        return;
    }

    currentMode = "LIVE";

    audio.pause();

    audio.removeAttribute("src");

    audio.load();

    casterLive.style.display =
        "block";

    playButton.style.display =
        "none";

    buttonLabel.style.display =
        "none";

    statusText.textContent =
        "🔴 LIVE ON AIR";

}


/* =====================================================
   AUDIO MODE
===================================================== */

function switchToAudio(audioFile){

    if(!audioFile){
        return;
    }


    currentMode = "AUDIO";


    casterLive.style.display =
        "none";


    playButton.style.display =
        "flex";


    buttonLabel.style.display =
        "block";


    statusText.textContent =
        "🎵 AUTOMATIC AUDIO";


    /*
       Only change the audio source when
       the admin actually changes the file.
    */

    if(currentAudio !== audioFile){

        const wasPlaying =
            !audio.paused &&
            !audio.ended &&
            audio.src;


        currentAudio =
            audioFile;


        audio.pause();


        /*
           IMPORTANT:
           Do not append a new timestamp every
           second. That was unnecessary and could
           interrupt playback.
        */

        audio.src =
            audioFile;


        audio.load();


        playButton.classList.remove(
            "playing"
        );

        playButton.textContent =
            "▶";

        buttonLabel.textContent =
            "TAP TO PLAY";


        if(wasPlaying){

            userHasStartedAudio =
                true;

        }

    }

}


/* =====================================================
   RANDOM START
===================================================== */

function getRandomStartPosition(){

    const duration =
        audio.duration;


    if(
        !Number.isFinite(duration) ||
        duration <= 0
    ){
        return 0;
    }


    const safeEnd =
        Math.max(
            0,
            duration - 0.5
        );


    if(safeEnd <= 0){
        return 0;
    }


    return Math.random() * safeEnd;

}


/* =====================================================
   PLAY AUDIO
===================================================== */

async function playAudio(){

    if(randomizing){
        return;
    }


    randomizing = true;


    try{

        /*
           Make sure metadata exists.
        */

        if(
            !Number.isFinite(audio.duration) ||
            audio.duration <= 0
        ){

            await new Promise(function(resolve){

                if(
                    Number.isFinite(audio.duration) &&
                    audio.duration > 0
                ){

                    resolve();
                    return;

                }


                let done =
                    false;


                const finish =
                    function(){

                        if(done){
                            return;
                        }

                        done = true;

                        resolve();

                    };


                audio.addEventListener(
                    "loadedmetadata",
                    finish,
                    {
                        once:true
                    }
                );


                setTimeout(
                    finish,
                    5000
                );

            });

        }


        /*
           Start at a random position.
        */

        if(
            Number.isFinite(audio.duration) &&
            audio.duration > 0
        ){

            const position =
                getRandomStartPosition();


            try{

                audio.currentTime =
                    position;

            }
            catch(error){

                console.log(
                    "Seek:",
                    error
                );

            }

        }


        await audio.play();


        userHasStartedAudio =
            true;


        playButton.classList.add(
            "playing"
        );


        playButton.textContent =
            "❚❚";


        buttonLabel.textContent =
            "NOW PLAYING";

    }
    catch(error){

        console.log(
            "Audio playback:",
            error
        );

    }
    finally{

        randomizing = false;

    }

}


/* =====================================================
   PLAY BUTTON
===================================================== */

playButton.addEventListener(
    "click",
    async function(){

        if(currentMode !== "AUDIO"){
            return;
        }


        if(audio.paused){

            if(!userHasStartedAudio){

                await playAudio();

            }
            else{

                try{

                    await audio.play();

                    playButton.classList.add(
                        "playing"
                    );

                    playButton.textContent =
                        "❚❚";

                    buttonLabel.textContent =
                        "NOW PLAYING";

                }
                catch(error){

                    console.log(
                        "Play:",
                        error
                    );

                }

            }

        }
        else{

            audio.pause();

            playButton.classList.remove(
                "playing"
            );

            playButton.textContent =
                "▶";

            buttonLabel.textContent =
                "TAP TO PLAY";

        }

    }
);


/* =====================================================
   AUDIO ENDED
===================================================== */

audio.addEventListener(
    "ended",
    function(){

        if(
            currentPlayMode ===
            "REPEAT"
        ){

            userHasStartedAudio =
                true;

            playAudio();

            return;
        }


        userHasStartedAudio =
            false;


        playButton.classList.remove(
            "playing"
        );

        playButton.textContent =
            "▶";

        buttonLabel.textContent =
            "TAP TO PLAY";

    }
);


/* =====================================================
   AUDIO ERROR
===================================================== */

audio.addEventListener(
    "error",
    function(){

        console.log(
            "Kulzzy audio error:",
            audio.error
        );

    }
);


/* =====================================================
   KEEP PLAYER STATE IN SYNC
===================================================== */

audio.addEventListener(
    "play",
    function(){

        playButton.classList.add(
            "playing"
        );

        playButton.textContent =
            "❚❚";

        buttonLabel.textContent =
            "NOW PLAYING";

    }
);


audio.addEventListener(
    "pause",
    function(){

        if(audio.ended){
            return;
        }

        playButton.classList.remove(
            "playing"
        );

        playButton.textContent =
            "▶";

        buttonLabel.textContent =
            "TAP TO PLAY";

    }
);


/* =====================================================
   INITIAL START
===================================================== */

/*
   Home loads immediately.
   No visible "Loading..." message.
*/

loadNormalSection("home");


/*
   Load player configuration.
*/

loadConfig();


/*
   Check configuration every 5 seconds
   instead of every 1 second so the player
   is not constantly disturbed.
*/

setInterval(
    loadConfig,
    5000
);
