<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#06152B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kulzzy Radio">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <title>Kulzzy Radio Network</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #06152B;
      font-family: Arial, sans-serif;
    }

    .loading {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .loading img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .loading h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .loading p {
      margin: 0;
      opacity: .8;
    }
  </style>
</head>

<body>

  <div class="loading">
    <img src="./icon-192.png" alt="Kulzzy Radio">
    <h1>Kulzzy Radio</h1>
    <p>Opening Kulzzy Radio...</p>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(function(error) {
          console.log("Service Worker:", error);
        });
    }

    setTimeout(function() {
      window.location.replace(
        "https://kulzzyradio.blogspot.com/?m=1"
      );
    }, 1000);
  </script>

</body>
</html>
