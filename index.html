<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Network</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#020d1a;
}

body{
    overflow-x:hidden;
}


/* =====================================================
   FLOATING NAVIGATION
===================================================== */

#kulzzyNav{

    position:fixed !important;

    top:0px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 16px);
    max-width:520px;

    height:48px;

    background:rgba(7,21,47,.98);

    border:1px solid rgba(255,215,0,.45);

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    padding:4px;

    z-index:99999999;

    box-shadow:
        0 4px 18px rgba(0,0,0,.25);
}


.kulzzyNavBtn{

    flex:1;

    height:40px;

    border:none;

    background:transparent;

    color:white;

    font-size:11px;

    font-weight:bold;

    border-radius:10px;

    cursor:pointer;

    white-space:nowrap;

    transition:.2s ease;

    -webkit-tap-highlight-color:transparent;
}


.kulzzyNavBtn:hover{

    background:
        rgba(255,215,0,.15);

    color:#ffd700;
}


.kulzzyNavBtn.active{

    background:#ffd700;

    color:#07152f;
}


/* =====================================================
   CONTENT
===================================================== */

#kulzzyContent{

    width:100%;

    margin:0;

    padding:
        70px
        12px
        240px;

}


/* =====================================================
   SECTIONS
===================================================== */

.kulzzySection{

    display:none;

    width:100%;

    max-width:700px;

    margin:0 auto;
}


.kulzzySection.active{

    display:block;
}


/* =====================================================
   FIREBASE CONTENT
===================================================== */

.kulzzyPublishedContent{

    width:100%;

    margin:0;

    padding:0;

    overflow:visible;
}


.kulzzyPublishedContent *{

    max-width:100%;
}


.kulzzyPublishedContent img{

    max-width:100%;

    height:auto;
}


.kulzzyPublishedContent video{

    max-width:100%;

    height:auto;
}


.kulzzyPublishedContent iframe{

    display:block;

    width:100%;

    max-width:100%;

    border:0;
}


.kulzzyPublishedContent table{

    max-width:100%;
}


/* =====================================================
   MORE PAGES
===================================================== */

#kulzzyMorePagesMenu{

    width:100%;

    margin:0;

    padding:0;

    display:flex;

    flex-direction:column;

    gap:10px;
}


.kulzzyMorePageButton{

    width:100%;

    border:1px solid
        rgba(255,215,0,.35);

    border-radius:12px;

    padding:14px 15px;

    background:#07152f;

    color:white;

    text-align:left;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s ease;

    -webkit-tap-highlight-color:transparent;
}


.kulzzyMorePageButton:hover{

    background:
        rgba(255,215,0,.12);

    color:#ffd700;
}


.kulzzyMorePageButton.active{

    background:#ffd700;

    color:#07152f;
}


#kulzzyMorePageContent{

    width:100%;

    margin:15px 0 0;

    padding:0;
}


.kulzzyMorePageContentBox{

    width:100%;

    margin:0;

    padding:0;

    background:transparent;

    color:inherit;

    border:none;

    border-radius:0;

    overflow:visible;

    line-height:1.6;
}


.kulzzyMorePageContentBox *{

    box-sizing:border-box;

    max-width:100%;
}


.kulzzyMorePageContentBox img{

    max-width:100% !important;

    height:auto !important;
}


.kulzzyMorePageContentBox video{

    max-width:100% !important;

    height:auto !important;
}


.kulzzyMorePageContentBox iframe{

    display:block;

    width:100% !important;

    max-width:100% !important;

    border:0;
}


.kulzzyMorePageContentBox table{

    width:100%;

    max-width:100%;

    overflow:auto;

    display:block;
}


.kulzzyMorePageContentBox p{

    line-height:1.7;
}


.kulzzyMorePageContentBox a{

    word-break:break-word;
}


.kulzzyMorePageContentBox ul,
.kulzzyMorePageContentBox ol{

    padding-left:25px;
}


/* =====================================================
   KULZZY RADIO FLOATING PLAYER
===================================================== */

#kulzzyFloatingRadio{

    position:fixed !important;

    left:0 !important;

    bottom:0 !important;

    width:100% !important;

    z-index:999999999 !important;

    background:#020d1a;

    border-top:4px solid #ffd000;

    box-shadow:
        0 -5px 25px rgba(0,0,0,.65);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow:hidden;
}


/* =====================================================
   PLAYER + LISTENERS
===================================================== */

.kulzzyFloatRow{

    width:100%;

    display:flex;

    align-items:stretch;
}


/* =====================================================
   PLAYER
===================================================== */

.kulzzyFloatPlayer{

    flex:1;

    min-width:0;

    height:210px;

    background:#020d1a;
}


.kulzzyFloatPlayer iframe{

    width:100%;

    height:100%;

    border:0;

    display:block;
}


/* =====================================================
   OUR LISTENERS
===================================================== */

.kulzzyFloatListeners{

    width:260px;

    min-width:260px;

    background:#020d1a;

    border-left:2px solid #ffd000;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:15px;
}


.kulzzyFloatListenerTitle{

    color:white;

    font-size:12px;

    font-weight:bold;

    white-space:nowrap;

    transform:scaleX(.85);
}


.kulzzyFloatDot{

    display:inline-block;

    width:15px;

    height:15px;

    background:red;

    border-radius:50%;

    margin-right:7px;

    animation:
        kulzzyFloatBlink 1s infinite;
}


.kulzzyFloatNumber{

    color:#ff0015;

    font-size:65px;

    font-weight:900;

    line-height:1;

    margin-top:12px;
}


/* =====================================================
   BLINK
===================================================== */

@keyframes kulzzyFloatBlink{

    0%,100%{

        opacity:1;

        box-shadow:
            0 0 6px red,
            0 0 15px red;
    }

    50%{

        opacity:.25;

        box-shadow:
            0 0 10px red,
            0 0 25px red;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    #kulzzyFloatingRadio{

        border-top-width:3px;
    }


    .kulzzyFloatRow{

        display:flex;

        flex-direction:row;

        align-items:stretch;
    }


    .kulzzyFloatPlayer{

        width:72%;

        height:200px;

        flex:none;
    }


    .kulzzyFloatListeners{

        width:28%;

        min-width:28%;

        padding:8px 3px;

        border-left:2px solid #ffd000;
    }


    .kulzzyFloatListenerTitle{

        font-size:13px;

        white-space:normal;
    }


    .kulzzyFloatDot{

        width:9px;

        height:9px;

        margin-right:3px;
    }


    .kulzzyFloatNumber{

        font-size:38px;

        margin-top:8px;
    }


    #kulzzyContent{

        padding-bottom:220px;
    }
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:380px){

    .kulzzyFloatPlayer{

        height:195px;
    }


    .kulzzyFloatListenerTitle{

        font-size:12px;
    }


    .kulzzyFloatNumber{

        font-size:32px;
    }


    #kulzzyContent{

        padding-bottom:215px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     FLOATING NAVIGATION
===================================================== -->

<nav id="kulzzyNav">

    <button
        type="button"
        class="kulzzyNavBtn active"
        data-section="home">

        Home

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="request">

        Request

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="wishes">

        Wishes

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="market">

        Market

    </button>


    <button
        type="button"
        class="kulzzyNavBtn"
        data-section="more">

        More

    </button>

</nav>



<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div id="kulzzyContent">


    <!-- HOME -->

    <section
        id="kulzzy-home"
        class="kulzzySection active">

        <div
            id="kulzzyPublished-home"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- REQUEST -->

    <section
        id="kulzzy-request"
        class="kulzzySection">

        <div
            id="kulzzyPublished-request"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- WISHES -->

    <section
        id="kulzzy-wishes"

        <div
            id="kulzzyPublished-wishes"
            class="kulzzyPublishedContent">
        </div>

    </section>



    <!-- MARKET -->

    <section
        id="kulzzy-market"

    </section>



    <!-- MORE -->

    <section

</div>



<!-- =====================================================
     KULZZY FLOATING RADIO PLAYER
===================================================== -->

<div id="kulzzyFloatingRadio">

    <div class="kulzzyFloatRow">


        <!-- RADIO PLAYER -->

        <div class="kulzzyFloatPlayer">

            <iframe

                src="https://donshangti2.github.io/KULZZY-AUTO-PLAYER/"

                title="Kulzzy Radio Network"

                allow="autoplay"

                scrolling="no">

            </iframe>

        </div>



        <!-- =================================================
             OUR LISTENERS
        ================================================= -->

        <div class="kulzzyFloatListeners">

            <div>

                <div class="kulzzyFloatListenerTitle">

                    <span
                        class="kulzzyFloatDot">
                    </span>

                    OUR LISTENERS

                </div>


                <div
                    id="kulzzyFloatingListenerNumber"
                    class="kulzzyFloatNumber">

                    0

                </div>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     LISTENER COUNTER
===================================================== -->

<script>

(function(){

    var count =
        Math.floor(
            Math.random() * 9000
        ) + 1000;


    var display =
        document.getElementById(
            "kulzzyFloatingListenerNumber"
        );


    if(!display){

        return;

    }


    display.textContent =
        count.toLocaleString();


    setInterval(function(){

        var increase =
            Math.random() > .5;


        var change =
            (
                Math.floor(
                    Math.random() * 8
                ) + 1
            ) * 10;


        if(increase){

            count += change;

        }

        else{

            count -= change;

        }


        if(count < 1000){

            count = 1000;

        }


        if(count > 9999){

            count = 9999;

        }


        display.textContent =
            count.toLocaleString();


    },4000);

})();

</script>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {

    getDatabase,
    ref,
    get

}

from

"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBH85NGWsSAK5cubbPdnmunwYZFZpj_CB0",

    authDomain:
        "kulzzy-radio-chat.firebaseapp.com",

    databaseURL:
        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kulzzy-radio-chat",

    storageBucket:
        "kulzzy-radio-chat.firebasestorage.app",

    messagingSenderId:
        "510100635134",

    appId:
        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


let app;

let db;


try{

    app =
        initializeApp(
            firebaseConfig
        );


    db =
        getDatabase(
            app
        );

}

catch(error){

    console.error(
        "Firebase initialization error:",
        error
    );

}


/* =====================================================
   SECTIONS
===================================================== */

const normalSections = [

    "home",
    "request",
    "wishes",
    "market"

];


/* =====================================================
   CACHE
===================================================== */

const loadedSections =
    Object.create(null);


const loadingSections =
    Object.create(null);


/* =====================================================
   MORE CACHE
===================================================== */

let morePagesLoaded = false;

let morePagesLoading = false;

let morePagesData = [];


/* =====================================================
   GET PAGE HTML
===================================================== */

function getPageHTML(page){

    if(!page){

        return "";

    }


    if(
        typeof page.html === "string" &&
        page.html.trim()
    ){

        return page.html;

    }


    const possibleFields = [

        "content",
        "writeUp",
        "writeup",
        "body",
        "description",
        "pageContent",
        "htmlContent"

    ];


    for(
        const field of possibleFields
    ){

        if(
            typeof page[field] === "string" &&
            page[field].trim()
        ){

            return page[field];

        }

    }


    if(
        page.blocks &&
        typeof page.blocks === "object"
    ){

        const blocks =

            Object.keys(
                page.blocks
            )

            .map(function(id){

                const block =
                    page.blocks[id] || {};


                return {

                    id:id,

                    html:
                        block.html ||
                        block.content ||
                        block.writeUp ||
                        "",

                    order:
                        typeof block.order === "number"
                        ? block.order
                        : 0

                };

            })

            .filter(function(block){

                return(
                    typeof block.html === "string" &&
                    block.html.trim()
                );

            })

            .sort(function(a,b){

                return a.order - b.order;

            });


        if(blocks.length){

            return blocks
                .map(function(block){

                    return block.html;

                })
                .join("\n\n");

        }

    }


    return "";

}


/* =====================================================
   EXECUTE PUBLISHED SCRIPTS
===================================================== */

function executePublishedScripts(container){

    if(!container){

        return;

    }


    const scripts =
        container.querySelectorAll("script");


    scripts.forEach(function(oldScript){

        const newScript =
            document.createElement("script");


        Array.from(
            oldScript.attributes
        )
        .forEach(function(attribute){

            newScript.setAttribute(
                attribute.name,
                attribute.value
            );

        });


        newScript.textContent =
            oldScript.textContent;


        if(oldScript.parentNode){

            oldScript.parentNode.replaceChild(
                newScript,
                oldScript
            );

        }

    });

}


/* =====================================================
   DISPLAY NORMAL CONTENT
===================================================== */

function displayNormalContent(section,html){

    const container =
        document.getElementById(
            "kulzzyPublished-" + section
        );


    if(!container){

        return;

    }


    if(
        !html ||
        !html.trim()
    ){

        loadedSections[section] = true;

        return;

    }


    const wrapper =
        document.createElement("div");


    wrapper.innerHTML =
        html;


    container.innerHTML =
        "";


    container.appendChild(
        wrapper
    );


    executePublishedScripts(
        wrapper
    );


    loadedSections[section] =
        true;

}


/* =====================================================
   FAST NORMAL SECTION LOADER
===================================================== */

async function loadNormalSection(section){

    if(
        !normalSections.includes(section)
    ){

        return;

    }


    if(
        loadedSections[section]
    ){

        return;

    }


    if(
        loadingSections[section]
    ){

        return loadingSections[section];

    }


    if(!db){

        return;

    }


    loadingSections[section] =

        (async function(){

            try{

                const snapshot =
                    await get(
                        ref(
                            db,
                            "kulzzyContent/" + section
                        )
                    );


                if(
                    snapshot.exists()
                ){

                    const data =
                        snapshot.val();


                    const html =
                        getPageHTML(data);


                    displayNormalContent(
                        section,
                        html
                    );

                }

                else{

                    loadedSections[section] =
                        true;

                }

            }

            catch(error){

                console.error(
                    "Firebase section error:",
                    section,
                    error
                );

            }

        })();


    try{

        await loadingSections[section];

    }

    finally{

        delete loadingSections[section];

    }

}


/* =====================================================
   MORE PAGES
===================================================== */

async function loadMorePages(){

    const menu =
        document.getElementById(
            "kulzzyMorePagesMenu"
        );


    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!menu || !content){

        return;

    }


    if(morePagesLoaded){

        return;

    }


    if(morePagesLoading){

        return morePagesLoading;

    }


    if(!db){

        return;

    }


    morePagesLoading =

        (async function(){

            try{

                const snapshot =
                    await get(
                        ref(
                            db,
                            "kulzzyMorePages"
                        )
                    );


                if(
                    !snapshot.exists()
                ){

                    morePagesLoaded = true;

                    return;

                }


                const data =
                    snapshot.val();


                morePagesData =

                    Object.keys(data)

                    .map(function(id){

                        const page =
                            data[id] || {};


                        return{

                            id:id,

                            title:
                                page.title ||
                                page.name ||
                                "Untitled Page",

                            html:
                                getPageHTML(page),

                            order:
                                typeof page.order === "number"
                                ? page.order
                                : 0

                        };

                    })

                    .sort(function(a,b){

                        return a.order - b.order;

                    });


                const fragment =
                    document.createDocumentFragment();


                morePagesData.forEach(
                    function(page){

                        const button =
                            document.createElement(
                                "button"
                            );


                        button.type =
                            "button";


                        button.className =
                            "kulzzyMorePageButton";


                        button.textContent =
                            page.title;


                        button.addEventListener(
                            "click",
                            function(){

                                showMorePage(
                                    page,
                                    button
                                );

                            }
                        );


                        fragment.appendChild(
                            button
                        );

                    }
                );


                menu.appendChild(
                    fragment
                );


                morePagesLoaded = true;

            }

            catch(error){

                console.error(
                    "Firebase More pages error:",
                    error
                );

            }

            finally{

                morePagesLoading = false;

            }

        })();


    return morePagesLoading;

}


/* =====================================================
   SHOW MORE PAGE
===================================================== */

function showMorePage(page,button){

    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!content){

        return;

    }


    document
        .querySelectorAll(
            ".kulzzyMorePageButton"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    const html =
        getPageHTML(page);


    if(
        !html ||
        !html.trim()
    ){

        content.innerHTML = "";

        return;

    }


    const pageBox =
        document.createElement(
            "div"
        );


    pageBox.className =
        "kulzzyMorePageContentBox";


    pageBox.innerHTML =
        html;


    content.innerHTML =
        "";


    content.appendChild(
        pageBox
    );


    executePublishedScripts(
        pageBox
    );

}


/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(section,button){

    document
        .querySelectorAll(
            ".kulzzySection"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    const target =
        document.getElementById(
            "kulzzy-" + section
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(
            ".kulzzyNavBtn"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(
        normalSections.includes(section)
    ){

        loadNormalSection(
            section
        );

    }


    if(section === "more"){

        loadMorePages();

    }

}


/* =====================================================
   PUBLIC NAVIGATION
===================================================== */

window.kulzzyOpen =
    function(section,button){

        openSection(
            section,
            button
        );

    };


/* =====================================================
   NAVIGATION EVENTS
===================================================== */

document
    .querySelectorAll(
        ".kulzzyNavBtn"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                openSection(
                    button.dataset.section,
                    button
                );

            }
        );

    });


/* =====================================================
   LOAD HOME IMMEDIATELY
===================================================== */

if(db){

    loadNormalSection("home");

}

</script>

</body>
</html>
