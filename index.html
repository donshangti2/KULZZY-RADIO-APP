<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#06152B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kulzzy Radio">

  <link rel="manifest" href="manifest.json">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="icon-192.png">

  <link rel="apple-touch-icon"
        href="icon-192.png">

  <title>Kulzzy Radio Network</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #06152B;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      border: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #06152B;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #loading img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    #loading h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    #loading p {
      margin: 0;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <div id="loading">
    <img src="icon-192.png" alt="Kulzzy Radio">
    <h2>Kulzzy Radio</h2>
    <p>Loading...</p>
  </div>

  <div id="app">
    <iframe
      src="https://kulzzyradio.blogspot.com/?m=1"
      title="Kulzzy Radio Network"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        const loading = document.getElementById("loading");
        if (loading) {
          loading.style.display = "none";
        }
      }, 800);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .then(function (registration) {
            console.log("Kulzzy Radio Service Worker registered:", registration.scope);
          })
          .catch(function (error) {
            console.error("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
